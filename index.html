<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>PTC PLC · IBFPL Hub</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#034b1d"><link rel="icon" href="icon-192.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--g:#0b3b1e;--gold:#e5b00d;--ind:#4f46e5;--bg:#f1f4f8;--tx:#16202c;--mu:#6b7889;--bd:#dfe5ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top)}
header{background:linear-gradient(135deg,#0b3b1e,#14532d);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logo{background:#fff;color:var(--g);font-weight:800;border-radius:10px;padding:6px 9px}
.hb{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:20px;padding:7px 12px;font:inherit;font-size:14px}.hb.p{background:var(--ind);border-color:var(--ind)}
nav{background:#0a2f18;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;position:sticky;top:0;z-index:5}
nav button{white-space:nowrap;border:0;background:transparent;color:#d6e6dc;padding:9px 14px;border-radius:20px;font:inherit}nav button.on{background:var(--gold);color:#1b1500;font-weight:700}
main{padding:12px;max-width:920px;margin:auto}
.c{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #1a2a4012}
h2{margin:0 0 4px;font-size:20px}h3{margin:0 0 8px;font-size:16px}.mu{color:var(--mu)}
.b{border:1px solid var(--bd);background:#fff;border-radius:12px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;margin:3px 4px 3px 0}
.b.p{background:var(--ind);color:#fff;border-color:var(--ind)}.b.g{background:#e8f8ee;color:#0f7a3d;border-color:#9fdcb7}.b.o{background:#fff6dc;color:#9a6a00;border-color:#f1d58a}.b.i{background:#eef1ff;color:#3730a3;border-color:#c7cdfa}.b.r{background:#fde8ec;color:#b4143a;border-color:#f5b3c1}
.tg{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;border:1px solid;margin:2px 4px 2px 0}
.good{background:#e8f8ee;color:#0f7a3d;border-color:#9fdcb7}.new{background:#e6f6fd;color:#0369a1;border-color:#9bd6f3}.fair{background:#fff6dc;color:#9a6a00;border-color:#f1d58a}.rep{background:#fff0e0;color:#b45309;border-color:#f6c58d}.dmg{background:#fde8ec;color:#b4143a;border-color:#f5b3c1}.adm{background:#f3e8ff;color:#7e22ce;border-color:#d8b4fe}.stf{background:#e0ecff;color:#1d4ed8;border-color:#a9c4fb}.req{background:#ecfdf5;color:#047857;border-color:#a7f3d0}.cod{background:#eceff3;color:#334155;border-color:#d0d7e1;font-family:monospace}
.alert{background:#fff1f3;border:1px solid #f7b6c3;border-radius:16px;padding:14px;margin-bottom:12px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;margin:3px 0;background:#fff;color:var(--tx)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .w{grid-column:1/3}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.row:last-child{border:0}
.bar{height:8px;border-radius:5px;background:#e7ecf3;margin:4px 0 10px;overflow:hidden}.bar i{display:block;height:100%}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp div{border:1px solid var(--bd);border-radius:14px;padding:12px}.kp b{font-size:26px;display:block}
#md{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:20}#md.on{display:flex}
#bx{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
img.ph{width:100%;max-height:260px;object-fit:contain;border:1px solid var(--bd);border-radius:14px;background:#fff}
.pw{white-space:pre-wrap}
body.dk{filter:invert(1) hue-rotate(180deg)}body.dk img{filter:invert(1) hue-rotate(180deg)}

#mn .scroll,#bx .scroll{overflow:auto;max-height:72vh;border:1px solid var(--bd);border-radius:10px}
table.rs{border-collapse:separate;border-spacing:0;margin:0}
table.rs th,table.rs td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(13px*var(--tz,1));padding:var(--rp,6px) 8px;border:0;border-bottom:1px solid var(--bd);position:relative}
table.rs th{position:sticky;top:0;background:#e9eef5;z-index:2;text-align:center}
table.rs td:first-child,table.rs th:first-child{position:sticky;left:0;background:#fff;z-index:1}
table.rs th:first-child{z-index:3;background:#e9eef5}
.rh{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:col-resize;touch-action:none}.rh:hover,.rh:active{background:#1d6fe055}
.rv{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:row-resize;touch-action:none}.rv:hover{background:#1d6fe055}
header{background:linear-gradient(135deg,var(--hd1,#0b3b1e),var(--hd2,#14532d))!important}
nav{background:var(--nv,#0a2f18)!important}
nav button.on{background:var(--gold)!important;color:var(--gtx,#1b1500)!important}
.brandt{font-weight:800;font-size:17px;letter-spacing:.4px}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ec{border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:#fff}
.av{width:76px;height:76px;border-radius:50%;margin:0 auto 6px;object-fit:cover;background:linear-gradient(135deg,var(--hd2,#14532d),var(--gold));color:#fff;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;overflow:hidden}
:root{--hd1:#034b1d;--hd2:#06622b;--nv:#023a16;--gold:#c8a80c;--g:#034b1d}
.ne{opacity:.55}
@media print{#mn .scroll{max-height:none}}
@media print{header,nav,.np{display:none}}

let pgId="";
function pga(T){const r=[];PGD.forEach(p=>p.al.forEach(a=>{const[s,m]=hsc(T,a[0]+" "+a[1],a[2]+" "+a[3]);if(m)r.push({p,a,s,m})}));r.sort((x,y)=>y.m-x.m||y.s-x.s);const L=r.slice(0,4);return L.length?`<div class="c"><h3>🛠 প্যানেল অ্যালার্ম গাইড (${L.length})</h3>${L.map(x=>`<div style="margin:8px 0"><b>${hl(x.a[0],T)}</b> <small class="mu">${E(x.p.t.split(" — ")[0])}</small><br>⚠ ${hl(x.a[1],T)}<br>🔍 ${E(x.a[2])}<br>✅ ${E(x.a[3])}</div>`).join("<hr>")}<button class="b" onclick="pgId='${L[0].p.id}';tab='pg';draw()">সব প্যানেল গাইড</button></div>`:""}
function pgv(){if(!pgId)return`<div class="c"><button class="b" onclick="tab='ie';draw()">← I&E Tools</button><h3>🛠 Panel Alarm Guide & Daily Check</h3><p class="mu"><small>অ্যালার্ম এলে কী বুঝবেন, কী চেক করবেন, কীভাবে রিসেট করবেন এবং প্রতিদিনের চেকলিস্ট। এটা সাধারণ নির্দেশনা — নির্দিষ্ট মডেলের ম্যানুয়াল ও সাইটের নিয়ম সবার আগে।</small></p></div><div class="c"><h3>⚠ অ্যালার্ম রিসেটের ৮টি নিয়ম</h3><ol>${RUL.map(r=>`<li style="margin:5px 0">${E(r)}</li>`).join("")}</ol></div><div class="eg">${PGD.map(p=>`<div class="ec" onclick="pgId='${p.id}';draw()"><img src="${p.img}" style="width:100%;border-radius:10px"><b>${E(p.t.split(" — ")[0])}</b><br><small class="mu">আজকের চেক: ${S.g.dpc.some(x=>x.date===iso()&&x.eq===p.t)?"✅ হয়েছে":"❌ বাকি"}</small></div>`).join("")}</div>`;
const p=PGD.find(x=>x.id===pgId),H=S.g.dpc.filter(x=>x.eq===p.t).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,15),ul=a=>"<ul>"+a.map(x=>`<li style="margin:4px 0">${E(x)}</li>`).join("")+"</ul>";
return`<div class="c"><button class="b" onclick="pgId='';draw()">← সব প্যানেল</button><h2>${E(p.t)}</h2><small class="mu">${E(p.mk)}</small><img src="${p.img}" class="ph" style="margin-top:8px">${(p.im2||[]).map(i=>`<img src="${i}" class="ph" style="margin-top:8px">`).join("")}${(p.ix||[]).map(i=>`<img src="${i}" class="ph" style="margin-top:8px">`).join("")}${p.img2?`<img src="${p.img2}" class="ph" style="margin-top:8px">`:""}<div class="pw" style="margin-top:8px">${E(p.w)}</div></div>

function allc(){if(!$("#o_r"))return;const f=(v,d=3)=>(+v).toLocaleString("en-US",{maximumFractionDigits:d});
const q=$v("o_q"),u=OU[$("#o_u").value],d=$v("o_d")||840,t=$v("o_t"),r=ocalc(q,u,d,t);
$("#o_r").innerHTML=rw("VCF (ambient → 15°C)",r.v.toFixed(5))+rw("Volume @ambient ("+t+"°C)",f(r.La,0)+" L")+rw("Volume @15°C",f(r.L15,0)+" L = "+f(r.L15/1000,3)+" m³")+rw("Mass",f(r.kg,1)+" kg = <span class='ok'>"+f(r.mt,3)+" MT</span>")+rw("US barrel (@15°C)",f(r.bbl,2))+rw("US gallon",f(r.gal,0))+rw("Imperial gallon",f(r.igal,0))+rw("Long ton / Short ton",f(r.lt,3)+" / "+f(r.st,3));
const ob=$v("d_o"),ot=$v("d_t");let d15=ob;for(let i=0;i<10;i++)d15=ob/VCF(d15,ot);$("#d_r").innerHTML=rw("Density @15°C",d15.toFixed(1)+" kg/m³")+rw("Relative density (60/60)",(d15/999.016).toFixed(4))+rw("VCF",VCF(d15,ot).toFixed(5));
const s=$v("g_s"),c=$v("g_c"),l=s-c;$("#g_r").innerHTML=rw("Loss(−)/Gain(+)",f(l)+" MT")+rw("শতাংশ",c?f(l/c*100,3)+" %":"—");
const id=$v("p_o")-2*$v("p_w"),A=Math.PI/4*Math.pow(id/1000,2),vol=A*$v("p_l")*1000;$("#p_r").innerHTML=rw("ভেতরের ব্যাস (ID)",f(id,1)+" mm")+rw("আয়তন",f(vol,1)+" m³ = "+f(vol*1000,0)+" L")+rw("ভরা তেল (MT)",f(vol*$v("p_d")/1000,1)+" MT");
const tm=$v("t_q"),td=$v("t_d")||840,tf=$v("t_f"),tv=tm*1000/td;$("#t_r").innerHTML=rw("আয়তন",f(tv,1)+" m³")+rw("সময়",tf?f(tv/tf,2)+" ঘণ্টা ("+f(tv/tf*60,0)+" মিনিট)":"—");
Object.entries(UC).forEach(([k,x])=>{const val=$v(k+"_v"),from=x[1][$("#"+k+"_u").value],b=val*from;$("#"+k+"_r").innerHTML=Object.entries(x[1]).map(([n,m])=>rw(n,f(b/m,4))).join("")});
const tv2=$v("tp_v"),tu=$("#tp_u").value,C=tu==="°C"?tv2:tu==="°F"?(tv2-32)*5/9:tv2-273.15;$("#tp_r").innerHTML=rw("°C",f(C,2))+rw("°F",f(C*9/5+32,2))+rw("K",f(C+273.15,2));
const kv=$v("e_k"),V=$v("e_v"),pf=$v("e_p"),ld=$v("e_l")/100,I=kv*1000/(Math.sqrt(3)*V);$("#e_r").innerHTML=rw("Full-load current",f(I,1)+" A")+rw("kW (PF "+pf+")",f(kv*pf,1))+rw(ld*100+"% লোডে কারেন্ট",f(I*ld,1)+" A")+rw("DG জ্বালানি (প্রায় ০.২৬ L/kWh)",f(kv*pf*ld*.26,1)+" L/ঘণ্টা")}
/* ---------- IBFPL & PTC guide ---------- */
const IBF=[["🏭 IBFPL এক নজরে",["ভারত–বাংলাদেশ মৈত্রী পাইপলাইন (IBFPL): ভারতের Numaligarh Refinery (NRL) থেকে Siliguri Marketing Terminal (SMT) হয়ে বাংলাদেশের পার্বতীপুর (দিনাজপুর) ডিপোতে HSD (ডিজেল) আনে।","ভিত্তিপ্রস্তর: সেপ্টেম্বর ২০১৮ (দুই প্রধানমন্ত্রী); উদ্বোধন ১৮ মার্চ ২০২৩; প্রথম পার্সেল ২১-০৩-২০২৩।","মোট দৈর্ঘ্য ≈ ১৩১.৫৭ কিমি: বাংলাদেশ অংশ ≈ ১২৬.৫৭ কিমি, ভারত অংশ ≈ ৫ কিমি (Siliguri থেকে সীমান্ত)।","পাইপ: ১০ ইঞ্চি; API 5L Gr X60 PSL2 HFW; wall ৯.৩ মিমি (LR bend ১০.২ মিমি); 3LPE কোটিং ২.৫ মিমি; ডিজাইন চাপ ৭০ kg/cm²।","মোট ব্যয় ≈ ৩৭৭ কোটি রুপি; বাংলাদেশ অংশ ≈ ২৮৫ কোটি রুপি (ভারত সরকারের অনুদান)।","লাইন-ফিল: ১৩১.৫ কিমি লাইনে ৫,২৬৭.৭৪৫ MT; ৭ কিমি লাইনে ১৭৮.২০৬ MT; নতুন ট্যাংক ফার্ম পাইপলাইনে ১৬.০৫৭ MT।","সরবরাহ লক্ষ্য (চুক্তির নোট): চালুর পর প্রথম ৩ বছর ২ লক্ষ, পরের ৩ বছর ৩ লক্ষ, তার পরের ৪ বছর ৫ লক্ষ ও বাকি ৫ বছর ১০ লক্ষ MT/বছর।"]],
["🔄 তেল কীভাবে আসে (ধাপে ধাপে)",["১) আসামের তেলক্ষেত্র থেকে crude oil পাইপলাইনে Numaligarh Refinery (NRL, Golaghat) পৌঁছায়। (সাধারণ তথ্য)","২) NRL-এ distillation/refining হয়ে পেট্রল, কেরোসিন, ডিজেল (HSD) ইত্যাদি তৈরি হয়।","৩) প্রস্তুত পণ্য ভারতের product pipeline (NSPL, ≈৬৬০ কিমি — প্রচলিত তথ্য) দিয়ে Siliguri Marketing Terminal (SMT)-এ আসে।","৪) DT / Sending end (SMT-সংলগ্ন dispatch টার্মিনাল) থেকে পাম্পে IBFPL-এ HSD পাঠানো হয়।","৫) ≈৫ কিমি ভারতের ভেতরে চলে সীমান্ত পেরিয়ে Banglabandha (SV-01)। এখানে Custody Transfer Meter (২টি Coriolis) ভারত→বাংলাদেশ হস্তান্তরের হিসাব নেয়।","৬) SV-02 Debnagar → SV-03 Kantamoni → SV-04 Chandipur → SV-05 Sonapukur হয়ে লাইন চলে।","৭) RT Parbatipur: Basket filter (40 micron) → flow measurement → Pig receiver → PCV/SRV → ট্যাংকে সংরক্ষণ।","৮) ট্যাংক থেকে Padma, Meghna ও Jamuna Oil-এর ডিপো ট্যাংকে বন্টন; ট্যাংক লরি/রেলে সারা উত্তরাঞ্চলে।","৯) SV-05 থেকে ৭ কিমি লাইন সৈয়দপুর ১৫০ MW বিদ্যুৎ কেন্দ্রে (PDB) ডিজেল দেয়।"]],
["📍 SV স্টেশন ও কাজ",["SV = Sectionalizing Valve। লাইনকে অংশে ভাগ করে; ফুটো/বিস্ফোরণে MOV দূর থেকে বন্ধ করে ক্ষতি সীমিত করে। এছাড়া PT/TT-তে চাপ-তাপমাত্রা মাপে, RTU/PLC দিয়ে SCADA-তে ডেটা পাঠায়, PIDS-এর ডেটা বহন করে।","SV-01 Banglabandha (তেঁতুলিয়া, পঞ্চগড়): সীমান্ত স্টেশন; Custody Transfer Meter (২টি Coriolis), MOV ×৪, DG, ট্রান্সফরমার 100 kVA (Energy Pack), PFI 60 kVAR (Simptech)।","SV-02 Debnagar (তেঁতুলিয়া, পঞ্চগড়): MOV, DG, CP প্যানেল, ফায়ার, সোলার, ট্রান্সফরমার 100 kVA (GEC)।","SV-03 Kantamoni (বোদা, পঞ্চগড়): MOV, DG, CP প্যানেল, ফায়ার, সোলার, ট্রান্সফরমার 100 kVA (GEC)।","SV-04 Chandipur (খানসামা, দিনাজপুর): MOV, DG, CP প্যানেল, ফায়ার, সোলার, ট্রান্সফরমার 100 kVA (GEC)।","SV-05 Sonapukur (চিরিরবন্দর, দিনাজপুর): ৭ কিমি লাইনের সংযোগস্থল; MOV, DG, CP প্যানেল, PT/TT, ট্রান্সফরমার 100 kVA (Energy Pack)।","প্রতিটিতে সাধারণ: Voltage stabilizer, DG, AC ×৬, ফায়ার, সোলার, LT/PFI প্যানেল, Lightning arrestor, Earth grid। (সর্বশেষ অবস্থা Equipment ট্যাবে — Ok / Not Ok)"]],
["⚡ ৭ কিমি লাইন (SV-05 → সৈয়দপুর)",["SV-05 Sonapukur (দিনাজপুর) থেকে সৈয়দপুর ১৫০ MW পাওয়ার প্লান্ট (PDB), নীলফামারী পর্যন্ত নতুন পাইপলাইন; ডিজেল বিদ্যুৎকেন্দ্রের জন্য।","যন্ত্রপাতি (ডকুমেন্ট অনুযায়ী): AUMA MOV; Emerson flowmeter; Sparko Engineering filter; PRV (চীনা ব্র্যান্ড); Sheyang Xinlian pig receiver; ABB SCADA; Honeywell PLC; এখানে PIDS নেই।","লাইনের ভেতরে তেল: ২১৫,০৭৩ L ≈ ১৭৮.২০৬ MT। প্রথম ডেলিভারি পার্সেল ৬৯ (আগস্ট ২০২৬)।"]],
["🏢 RT পার্বতীপুর (Receiving Terminal)",["ট্যাংক, পাম্পিং, মিটারিং, ফায়ার প্রোটেকশন ও ESD সিস্টেম।","নতুন ট্যাংক ফার্ম: ডিজেল ট্যাংক (প্রায় ৫.৭ মিলিয়ন লিটার/ট্যাংক) ও ২টি ৩০ লক্ষ লিটারের পানির ট্যাংক; ফায়ার পাম্প হাউসে ৩টি পাম্প (electric, jockey, standby)।","কন্ট্রোল: ABB SCADAvantage + Honeywell Experion PKS/Safety Manager (PLC/ESD); PIDS (Commptel); Flow computer ও Flowmeter (Endress+Hauser); MOV (Rotork/AUMA); PCV (Pladon); SRV (Daniel)।","পাওয়ার: 11/0.415 kV সাবস্টেশন, DG, Hitachi UPS, ব্যাটারি ব্যাংক (AGM VRLA), PFI (Energex 190 kVAR), CP প্যানেল।"]],

["🌊 SPM — Single Point Mooring (মহেশখালী)",["গভীর সমুদ্রের ট্যাংকার থেকে সরাসরি পাইপলাইনে তেল নামানো (lighter ছাড়া) — সময় ও ব্যয় কমায়।","বার্ষিক খালাস সক্ষমতা ≈ ৯ মিলিয়ন টন (রিপোর্ট অনুযায়ী); ডাবল পাইপলাইন: একটি crude oil, একটি ডিজেল; ≈ ১১০ কিমি × ২ = ২২০ কিমি; গন্তব্য ERL, পতেঙ্গা।","মহেশখালীতে ৩টি crude ট্যাংক (প্রতিটি ৫০,০০০ m³) ও ৩টি HSD ট্যাংক (প্রতিটি ৩০,০০০ m³), মূল ও বুস্টার পাম্প।","ঠিকাদার China Petroleum Pipeline Bureau (CPP); SPM ও পাইপ Blue Water (নেদারল্যান্ডস) — রিপোর্ট অনুযায়ী।","সাধারণ যন্ত্র: CALM buoy ও fluid swivel, PLEM, সাবসি হোস, অফশোর/অনশোর পাইপলাইন, পাম্প স্টেশন, মিটারিং, SCADA/টেলিকম।"]],
