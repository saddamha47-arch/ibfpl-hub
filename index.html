*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top)}
header{background:linear-gradient(135deg,#0b3b1e,#14532d);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logo{background:#fff;color:var(--g);font-weight:800;border-radius:10px;padding:6px 9px}

.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f .w{grid-column:1/3}

function lgu(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,240/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;const x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data,h={};for(let i=0;i<d.length;i+=8){const R=d[i],G=d[i+1],B=d[i+2],A=d[i+3],mx=Math.max(R,G,B),mn=Math.min(R,G,B);if(A<200||(mx>235&&mn>215)||mx<45||mx-mn<45)continue;const q=[R>>5,G>>5,B>>5].join();h[q]=(h[q]||0)+1}
