const Wk=S.g.wo.map(x=>{const[a,m]=hsc(T,x.eq,[x.act,x.loc].join(" "));return{x,a,m}}).filter(r=>r.m&&r.x.act).sort(srt).slice(0,5);
const Dc=S.g.docs.map(x=>{const[a,m]=hsc(T,x.title,x.kind);return{x,a,m}}).filter(r=>r.m).sort(srt).slice(0,5);
const K=Object.keys(KB).map(k=>{const kb=KB[k],pr=kb.x.filter(p=>hsc(T,p[0]+" "+p[1],"")[1]),tm=hsc(T,k+" "+(TYPEN[k]||""),kb.f)[1];return{k,kb,pr:pr.length?pr:(tm?kb.x:[]),m:pr.length+tm,a:0}}).filter(r=>r.pr.length).sort(srt).slice(0,4);
out+=`<div class="c"><h3>📚 আমাদের পুরোনো রেকর্ড (${I.length})</h3>${I.map((r,i)=>{const x=r.x;return`<details class="c" ${i?"":"open"}><summary><b>${hl(x.eq,T)}</b> <span class="tg new">${E(x.cat)}</span> <span class="tg ${x.st==="Resolved"?"good":"fair"}">${E(x.st)}</span><br><small class="mu">${fd(x.date)} · 📍${E(x.loc)}</small></summary>${x.ph?`<img class="ph" src="${x.ph}">`:""}<div class="pw"><b>⚠ সমস্যা:</b> ${hl(x.prob,T)}</div><div class="pw"><b>🔎 কারণ:</b> ${hl(x.cause||"—",T)}</div><div class="pw"><b>✅ সমাধান:</b> ${hl(x.act||"—",T)}</div><div class="pw"><b>📌 সতর্কতা:</b> ${hl(x.prev||"—",T)}</div></details>`}).join("")||`<span class="mu">এই সমস্যার কোনো পুরোনো রেকর্ড মেলেনি।</span>${can("rec")?`<br><button class="b p" onclick="nin()">＋ নতুন সমস্যা হিসেবে Problem Log-এ যোগ করুন</button>`:""}`}</div>`;
if(Wk.length)out+=`<div class="c"><h3>🔧 সংশ্লিষ্ট Work Order</h3>${Wk.map(r=>`<div class="pw" style="margin:8px 0"><b>${hl(r.x.eq,T)}</b> <small class="mu">${fd(r.x.date)} · ${E(r.x.loc)}</small><br>✅ ${hl(r.x.act,T)}</div>`).join("")}</div>`;
if(K.length)out+=`<div class="c"><h3>💡 সাধারণ গাইডলাইন (OEM ম্যানুয়াল মিলিয়ে নিন)</h3>${K.map(r=>`<b>${E(r.k)}</b> <small class="mu">${E(r.kb.f)}</small>${r.pr.map(p=>`<div style="margin:6px 0">⚠ ${hl(p[0],T)}<br>✅ ${hl(p[1],T)}</div>`).join("")}`).join("<hr>")}</div>`;
if(Dc.length)out+=`<div class="c"><h3>📄 সংশ্লিষ্ট ডকুমেন্ট</h3>${Dc.map(r=>`<div class="row" style="cursor:default"><span><b>${hl(r.x.title,T)}</b> <span class="tg new">${E(r.x.kind)}</span></span>${/^https?:\/\//.test(r.x.url||"")?`<a class="b i" style="text-decoration:none" target="_blank" rel="noopener" href="${E(r.x.url)}">Open</a>`:""}</div>`).join("")}</div>`}
return`<div class="c"><h3>🔎 সমস্যার সমাধান খুঁজুন</h3><p class="mu">নতুন কোনো সমস্যা (জেনারেটর, প্যানেল, PLC…) দেখলে এখানে লিখে খুঁজুন। আগের রেকর্ডে মিললে সমস্যা ও সমাধানের বিবরণ দেখাবে।</p><input id="hq" placeholder="যেমন: জেনারেটর স্টার্ট হচ্ছে না / UPS battery low" value="${E(hq)}" oninput="hq=this.value;draw();const e=$('#hq');e.focus();e.setSelectionRange(99999,99999)"><div style="overflow-x:auto;white-space:nowrap">${["Generator","UPS","PLC","SCADA","RTU","MOV","Panel","Transmitter","Flow computer","Fire pump"].map(c=>`<button class="b" onclick="hq='${c}';draw()">${c}</button>`).join("")}</div></div>${out}`}
draw();
window.addEventListener("fbready",()=>{F=window.FB;if(!F.ok){$("#mn").innerHTML='<div class="c"><h3>Firebase setup দরকার</h3><p>ফাইলের শুরুতে firebaseConfig-এ নিজের Firebase তথ্য বসান।</p></div>';return}
F.listen("items",a=>{S.items=a;draw()});F.listen("tx",a=>{S.tx=a;draw()});F.listen("equip",a=>{S.eq=a;draw();const h=location.hash;if(h.startsWith("#eq=")&&S.eq.find(x=>x.id===h.slice(4))){const id=h.slice(4);location.hash="";eqd(id)}});let un=[];
F.onAuth(async u=>{un.forEach(f=>f());un=[];if(!u){me=null;S.users=[];S.reqs=[];S.log=[];S.inc=[];S.lv=[];S.g=Object.fromEntries(GK.map(k=>[k,[]]));draw();return}
let d=await F.get("users",u.uid);if(!d){d={name:pend.name||u.email,des:pend.des||"",email:u.email,role:"helper"};await F.set("users",u.uid,d)}
me={id:u.uid,...d};
un.push(F.listen("users",a=>{S.users=a;const m=a.find(x=>x.id===u.uid);if(m)me={id:u.uid,...m};draw()}),F.listen("reqs",a=>{S.reqs=a;draw()}),F.listen("incidents",a=>{S.inc=a;draw()}),F.listen("leave",a=>{S.lv=a;draw()}),...GK.map(k=>F.listen(k,a=>{S.g[k]=a;draw()})),F.listen("log",a=>{S.log=a.sort((x,y)=>(y.ts||0)-(x.ts||0));draw()}));draw()});draw()});
