"]]}}, {"id": "pw2", "start": 399.3, "end": 410.69, "loc": "Power — generator and AMF panel", "card": {"t": "DG set 250 kVA", "rows": [["Make", "Sterling — Perkins engine, Stamford alternator"], ["AMF", "Auto start on mains failure; auto changeover"], ["Weekly", "Run test; check water in fuel tank; log"], ["Alarm", "Accept → reset → check fuel/coolant/battery → report"], ["PM", "As per OEM schedule"]]}}, {"id": "pw3", "start": 411.59, "end": 421.98, "loc": "Power — battery bank, charger and UPS", "card": {"t": "DC and UPS", "rows": [["Charger", "48 V / 450 A float-cum-boost, A & B (Modbus TCP)"], ["Battery", "AGM VRLA bank"], ["UPS", "Hitachi"], ["Stabilizer", "Numax 100 kVA"], ["Check", "Charger alarms: accept and reset · UPS alarm: MUTE only"]]}}, {"id": "pw4", "start": 421.98, "end": 421.98, "loc": "Power — HVAC and solar", "card": null}, {"id": "pw5", "start": 421.98, "end": 421.98, "loc": "Power — fire system and cathodic protection", "card": null}, {"id": "em1", "start": 422.88, "end": 430.41, "loc": "Emergency — ESD", "card": {"t": "ESD steps", "rows": [["1", "Press ESD (field / panel / control room)"], ["2", "Pumps trip · MOV-1201, MOV-1503 close"], ["3", "Inform CR, In-charge, neighbouring stations"], ["4", "Isolate · make safe · assess"], ["5", "Restart only with In-charge approval"]]}}, {"id": "em2", "start": 431.31, "end": 440.38, "loc": "Emergency — pipeline leak", "card": {"t": "Leak response", "rows": [["Detect", "Pressure drop · LDS volume balance · PIDS · public report"], ["Confirm", "Check neighbouring stations, flows"], ["Act", "ESD → close SVs both sides → locate leak"], ["Field", "Patrol, cordon, no ignition, inform authorities"], ["Repair", "Depressurise per approved procedure; record volume"]]}}, {"id": "em3", "start": 441.28, "end": 449.19, "loc": "Emergency — fire", "card": {"t": "Fire response", "rows": [["Alarm", "2oo3 gas/flame · MCP · siren"], ["Control room", "ESD · alarm · call fire service 102 / 16163 · 999"], ["Team", "Muster point · headcount · small fires only with extinguisher"], ["Isolate", "Close nearest valves · stop pumps"], ["Never", "Open doors onto hydrocarbon fire; restart before clearance"]]}}, {"id": "em4", "start": 450.09, "end": 460.03, "loc": "Emergency — power failure", "card": {"t": "Power failure", "rows": [["Auto", "AMF starts DG · UPS/battery bridge the gap"], ["Check", "DG running and loaded · fuel level · battery V · UPS time"], ["Reduce", "Shed non-essential load (HVAC, lighting)"], ["DG fails", "Controlled shutdown · close valves · inform In-charge"], ["Daily", "Emergency lamps check"]]}}, {"id": "end", "start": 460.93, "end": 474.67, "loc": "IBFPL — one protected system", "card": {"t": "Remember", "rows": [["1", "Know every tag, interlock and alarm"], ["2", "Check on time — record — report"], ["3", "ESD first when life or plant is at risk"], ["4", "Never bypass a safety device"], ["5", "Stay alert, stay safe"]]}}];const SUB=[[2.0, 13.56, "The India–Bangladesh Friendship Pipeline, IBFPL, carries high speed diesel from Siliguri in India to Parbatipur in Bangladesh."], [13.56, 22.54, "One million tonnes a year, a 10.75 inch line, about 132 kilometres, commissioned on 18 March 2023."], [23.44, 32.78, "The diesel is refined from crude oil at Numaligarh Refinery in Assam and reaches the NRL Siliguri Marketing Terminal."], [32.78, 41.71, "From there IBFPL crosses the border, passes five valve stations, and ends at the receipt terminal at Parbatipur."], [41.71, 44.5, "A branch from SV-05 serves Saidpur."], [45.4, 54.42, "The line is carbon steel pipe, 10.75 inch diameter, designed for 70 kilograms per square centimetre."], [54.42, 64.42, "One million tonnes a year is about 114 tonnes per hour on average, roughly 136 cubic metres per hour of diesel."], [64.42, 69.29, "The line holds about 5,270 tonnes of diesel when full."], [70.19, 74.93, "At Siliguri, diesel from the storage tanks enters the inlet header."], [74.93, 79.81, "Booster pumps, one working and one standby, feed the main line pumps."], [79.81, 86.81, "Every pump is protected by pressure trips and flame detectors, and a sump tank collects the drains."], [87.71, 94.18, "Main line pumps raise the pressure, and a pig launcher sends cleaning pigs into the line."], [94.18, 100.36, "On emergency shutdown, all pumps trip, and the station inlet and outlet valves close."], [101.26, 108.11, "At the international border, the custody transfer metering system records every litre handed over."], [108.11, 114.96, "Two Coriolis meters, with temperature and pressure transmitters, feed a dual stream flow computer."], [115.86, 119.42, "From the border the pipeline runs underground."], [119.42, 133.2, "At each valve station, Banglabandha, Debnagar, Kantamoni, Chandipur and Sonapukur, motor operated valves, pressure transmitters and R T Us report to SCADA over fibre optic cable."], [134.1, 136.3, "Pigging is done every six months."], [136.3, 146.03, "The pig cleans the pipe wall while signallers confirm its passage, and the leak detection system watches pressure and volume balance continuously."], [146.93, 158.41, "About fourteen kilometres before Parbatipur, at SV-05, a tap off sends diesel through an eight inch branch of around seven kilometres to Saidpur."], [158.41, 161.41, "The main line continues to Parbatipur."], [162.31, 170.39, "At Receipt Terminal Parbatipur, the line enters through valve SV-2005."], [170.39, 187.7, "Temperature transmitter TT-1701 and pressure transmitters PT-1702 and PT-1703 monitor the incoming diesel, and MOV-1701 opens toward the pig receiver."], [188.6, 194.43, "The pig receiver, designed for 70 kilograms per square centimetre, catches the pig."], [194.43, 196.6, "Pig signallers confirm arrival."], [196.6, 203.83, "Relief valves protect the barrel, and drains flow to the sump tank, where the sump pump transfers them."], [204.73, 208.35, "Diesel then passes duty and standby basket filters."], [208.35, 216.73, "Differential pressure transmitters show clogging, and the operator changes over before the pressure drop becomes high."], [216.73, 220.56, "Gas detectors nearby alarm on a two out of three vote."], [221.46, 230.06, "Pressure control valve PV-1801 keeps the pressure to the tanks steady."], [230.06, 240.01, "If pressure surges, the surge relief valve SRV-1801 opens toward the surge tanks."], [240.01, 247.02, "High high pressure on PT-1805 to PT-1807 closes MOV-1703."], [247.92, 267.82, "Dual Coriolis meters FE-1801 and FE-1802, with temperature and pressure transmitters, send mass flow, density and temperature to flow computer FQY-1801, which calculates the quantity received."], [268.72, 279.65, "Motor operated valves then route the diesel to the depot storage tanks, Padma, Meghna and Jamuna, where each company's parcel is received and stored."], [279.65, 284.13, "Tank level and valve status are repeated in the control room."], [285.03, 286.3, "Now at Saidpur."], [286.3, 303.05, "The eight inch branch, designed for 98 kilograms per square centimetre, enters the receipt station at pig receiver PR-1001, with signallers and valve MOV-1003, before flowing to the basket filters."], [303.95, 311.62, "Basket filters FS-1001 A and B change over automatically on high differential pressure."], [311.62, 321.06, "The custody metering skid has two Coriolis meters, one working and one standby, with flow computer FC-1001."], [321.96, 329.29, "The pressure regulation skid has two runs, with control valves PCV-1001 and PCV-1002."], [329.29, 338.43, "Slam shut valves close within about two seconds on high high pressure, protecting the power plant storage."], [339.33, 343.97, "Finally the diesel enters the PDB oil tank manifold for storage."], [343.97, 351.81, "The closed drain tank, with its sump pump and booster pump, handles the drains and returns them to the line."], [352.71, 361.94, "The control room runs everything: ABB SCADA, Honeywell safety PLC, Commptel PIDS, leak detection and flow computers."], [361.94, 365.04, "The engineer watches, decides and acts."], [365.94, 374.99, "On SCADA the engineer watches pressures, flows, valve status and alarms, and acknowledges alarms every day at midnight."], [375.89, 379.95, "PIDS listens along the pipeline fibre for digging and tapping."], [379.95, 384.68, "Leak detection compares flow in and flow out and watches pressure waves."], [385.58, 398.4, "Power arrives at 11 kilovolts, passes the HT vacuum breaker panel and the transformer, and reaches the 415 volt LT panel with power factor correction."], [399.3, 410.69, "If grid power fails, the 250 kilovolt ampere diesel generator starts automatically through the AMF panel, and runs once a week for testing."], [411.59, 421.98, "Battery chargers keep the 48 volt battery bank full, and the UPS gives clean power to SCADA and instruments when the grid and generator fail."], [422.88, 425.77, "In an emergency, press the ESD button."], [425.77, 430.41, "All pumps trip and the station inlet and outlet valves close."], [431.31, 436.35, "A leak shows as a pressure drop, a volume imbalance and a PIDS alert."], [436.35, 440.38, "Isolate both valves, stop pumping, and send the patrol."], [441.28, 449.19, "On a fire alarm, press ESD, call the fire service, and use the nearest extinguisher only if it is safe."], [450.09, 457.29, "On power failure, the generator starts, while UPS and batteries keep SCADA and instruments alive."], [457.29, 460.03, "Check the generator and reduce loads."], [460.93, 469.3, "From Siliguri to Parbatipur and Saidpur, every valve, transmitter and detector works as one protected system."], [469.3, 472.98, "Know each tag, each interlock and each response."], [472.98, 474.67, "Stay alert, stay safe."]];const AUDIO="narration_summary.mp3";const EDN="Summary";
